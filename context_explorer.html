<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WCS Context Explorer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap');

    :root {
      --bg: #09090b;
      --bg-panel: rgba(24, 24, 27, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 15px 30px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    h1 {
      margin: 0;
      font-weight: 800;
      font-size: 22px;
      color: #fff;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-left: 24px;
    }
    nav a:hover { color: var(--accent); }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .search-box {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .search-box input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-family: inherit;
      outline: none;
    }

    .word-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .word-item {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .word-item:hover { background: rgba(255,255,255,0.05); }
    .word-item.active { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
    
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
    }
    
    .content-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .summary-card {
      background: rgba(59, 130, 246, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
    }
    
    .summary-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 16px 0;
      color: #93c5fd;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    
    .summary-stat {
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    
    .summary-stat-model {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .summary-stat-values {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
    }

    .context-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .text-body {
      font-family: 'Merriweather', serif;
      font-size: 16px;
      line-height: 1.8;
      color: #d4d4d8;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
    
    .target-word {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .model-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .model-badge {
      padding: 10px;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .model-badge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }
    
    .model-badge-stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
    }
    
    .found-text { color: #6ee7b7; }
    .missed-text { color: #fca5a5; }

    .prob-excellent { color: #10b981; }
    .prob-good { color: #34d399; }
    .prob-fair { color: #facc15; }
    .prob-poor { color: #fb923c; }
    .prob-missed { color: #ef4444; }

    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: 40vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .content {
        padding: 20px;
      }
      header {
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Context Explorer</h1>
    <nav>
      <a href="index.html">Main Suite</a>
    </nav>
  </header>
  
  <main>
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search words...">
      </div>
      <div class="word-list" id="wordList"></div>
    </div>
    
    <div class="content" id="mainContent">
      <div class="content-inner" id="contentInner">
        <p style="text-align:center; margin-top:40px; color:var(--text-muted)">Loading data...</p>
      </div>
    </div>
  </main>

  <script>
    const state = { data: null, selectedWord: null, searchQuery: '' };

    function init(data) {
      state.data = data;
      const words = Object.keys(data.words).sort();
      if (words.length > 0) selectWord(words[0]);
    }

    function renderSidebar() {
      const container = document.getElementById('wordList');
      container.innerHTML = '';
      let words = Object.keys(state.data.words).sort();
      if (state.searchQuery) words = words.filter(w => w.toLowerCase().includes(state.searchQuery.toLowerCase()));
      
      words.forEach(w => {
        const item = document.createElement('div');
        item.className = `word-item ${w === state.selectedWord ? 'active' : ''}`;
        item.innerHTML = `<span>${w}</span>`;
        item.onclick = () => selectWord(w);
        container.appendChild(item);
      });
    }

    function selectWord(word) {
      state.selectedWord = word;
      renderSidebar();
      renderContent();
    }

    function renderContent() {
      const container = document.getElementById('contentInner');
      const wordData = state.data.words[state.selectedWord];
      if (!wordData) return;

      // Calculate Averages per Model
      const averages = {};
      state.data.models.forEach(model => {
        let totalProb = 0;
        let totalRank = 0;
        let count = 0;
        wordData.contexts.forEach(ctx => {
          if (ctx.results[model]) {
            totalProb += ctx.results[model].prob;
            totalRank += ctx.results[model].rank;
            count++;
          }
        });
        if (count > 0) {
          averages[model] = {
            prob: totalProb / count,
            rank: totalRank / count
          };
        }
      });

      // Render Summary Card
      let html = `
        <div class="summary-card">
          <h2 class="summary-title">"${state.selectedWord}" - Average Performance</h2>
          <div class="summary-grid">
      `;
      Object.keys(averages).sort().forEach(model => {
        const avg = averages[model];
        html += `
          <div class="summary-stat">
            <div class="summary-stat-model" title="${model}">${model.split('/').pop()}</div>
            <div class="summary-stat-values">
              Prob: ${(avg.prob * 100).toFixed(2)}%<br>
              Rank: ${avg.rank.toFixed(1)}
            </div>
          </div>
        `;
      });
      html += `</div></div>`;

      // Render Contexts
      wordData.contexts.forEach((ctx, index) => {
        const displayText = ctx.prefix + `<span class="target-word">${ctx.target}</span>`;
        html += `
          <div class="context-card">
            <h3 style="margin-top:0; color:var(--text-muted); font-size:14px; text-transform:uppercase;">Context ${index + 1}</h3>
            <div class="text-body">${displayText}</div>
            <div class="model-results">
        `;
        
        state.data.models.forEach(model => {
          const res = ctx.results[model];
          if (!res) return;
          
          let statusText = '';
          let statusClass = '';
          if (res.prob >= 0.8) {
            statusText = 'Excellent';
            statusClass = 'prob-excellent';
          } else if (res.prob >= 0.5) {
            statusText = 'Good';
            statusClass = 'prob-good';
          } else if (res.prob >= 0.1) {
            statusText = 'Fair';
            statusClass = 'prob-fair';
          } else if (res.prob >= 0.01) {
            statusText = 'Poor';
            statusClass = 'prob-poor';
          } else {
            statusText = 'Missed';
            statusClass = 'prob-missed';
          }
          
          let top5Html = '';
          if (res.top5 && res.top5.length > 0) {
            top5Html = '<div style="margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">' + 
                       '<div style="font-size: 11px; color: #a1a1aa; margin-bottom: 4px;">Top 5 Predictions:</div>';
            res.top5.forEach((t, i) => {
              let tokenText = t.t ? t.t.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
              top5Html += `<div style="display:flex; justify-content:space-between; font-size:12px; font-family:'JetBrains Mono', monospace;">
                             <span style="color:#e4e4e7">"${tokenText}"</span>
                             <span style="color:#71717a">${(t.p * 100).toFixed(2)}%</span>
                           </div>`;
            });
            top5Html += '</div>';
          }

          html += `
            <div class="model-badge">
              <div class="model-badge-header">
                <span title="${model}">${model.split('/').pop()}</span>
                <span class="${statusClass}">${statusText}</span>
              </div>
              <div class="model-badge-stats">
                Target Prob: ${(res.prob * 100).toFixed(4)}%<br>
                Target Rank: ${res.rank}
              </div>
              ${top5Html}
            </div>
          `;
        });
        html += `</div></div>`;
      });

      container.innerHTML = html;
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      renderSidebar();
    });

    fetch('explorer_data.json?v=' + Date.now(), { cache: "no-store" })
      .then(res => res.json())
      .then(data => init(data))
      .catch(err => {
        document.getElementById('contentInner').innerHTML = '<p>Error loading data.</p>';
      });
  </script>
</body>
</html>
